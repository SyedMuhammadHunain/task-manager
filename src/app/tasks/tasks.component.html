@if (isAddTask) {
<app-new-task />
} @if (isAddTask) {
<app-new-task (close)="onCloseAddTask()" [userId]="userId" />
}

<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button (click)="onAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
    <li>
      <app-in-task [task]="task" />
    </li>
    }
  </ul>
</section>
